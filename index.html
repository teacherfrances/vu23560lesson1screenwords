<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Point With Words</title>
<style>
:root{
  --ink:#111; --ink2:#333; --grey:#5b5f66; --line:#c9cdd3; --panel:#f1f2f4; --panel2:#e6e8eb; --white:#fff;
  --what:#1a56b8; --whatT:#e3ecfb; --where:#c07a12; --whereT:#fdf0db;
  --ok:#1e7a46; --okT:#e6f4ec; --bad:#a6301f; --badT:#fbeae7;
  --fs:28px;
  --head:"Century Gothic","URW Gothic","URW Gothic L","Avenir Next","Avenir","Questrial",Carlito,Calibri,system-ui,sans-serif;
  --body:Calibri,Carlito,"Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-tap-highlight-color:rgba(26,86,184,.2)}
.hs.lab{border-radius:50%;z-index:4}
body{background:#fff;color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.35}
body.s1{--fs:28px} body.s2{--fs:34px} body.s3{--fs:42px}
button{font:inherit;color:inherit;cursor:pointer}
/* ---- top bar ---- */
.top{position:fixed;top:0;left:0;right:0;z-index:20;background:#1b1b1b;color:#fff;display:flex;align-items:center;gap:.4em;padding:.25em .5em;min-height:2.2em}
.top .dots{display:flex;gap:.25em;margin-right:.2em}
.top .dots i{width:.45em;height:.45em;border-radius:50%;display:block}
.top .addr{flex:1;min-width:0;background:#333;border-radius:2em;padding:.12em .7em;font-size:.72em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ddd}
.top .addr b{color:#fff}
.top .cnt{font-family:var(--head);font-weight:700;font-size:.72em;background:#fff;color:#111;border-radius:2em;padding:.1em .6em;white-space:nowrap}
.tb{background:#333;border:2px solid #555;color:#fff;border-radius:.4em;min-width:2.1em;min-height:1.9em;font-size:.72em;font-weight:700;padding:0 .4em}
.tb:hover{background:#444}
/* ---- main ---- */
main{position:absolute;top:2.4em;bottom:2.6em;left:0;right:0;overflow:auto;padding:.6em 1em 1em}
.slide{max-width:1500px;margin:0 auto}
.bar{display:flex;align-items:stretch;margin:.1em 0 .5em;border:2px solid #111}
.bar .L{background:#111;color:#fff;font-family:var(--head);font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 .5em;min-width:1.8em;font-size:.9em}
.bar .T{background:var(--panel);font-family:var(--head);font-weight:700;padding:.2em .6em;flex:1;font-size:.95em}
.sub{color:var(--ink2);margin:.1em 0 .5em}
.what{color:var(--what);font-weight:700}
.where{color:var(--where);font-weight:700}
.pill{display:inline;border-radius:.35em;padding:.05em .25em;font-weight:700;-webkit-box-decoration-break:clone;box-decoration-break:clone;line-height:1.6}
.pill.w1{background:var(--whatT);color:var(--what);border-bottom:3px solid var(--what)}
.pill.w2{background:var(--whereT);color:#8a5210;border-bottom:3px solid var(--where)}
.pill.act{background:#eee;color:#111;border-bottom:3px solid #111}
/* ---- figure with hotspots ---- */
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:1em;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}.two{gap:.4em}.two>div:last-child>p:first-child,.two>div:last-child>.say:first-child{margin-top:.15em}.two>div:first-child{position:sticky;top:-.6em;z-index:6;background:#fff;padding:.3em 0 .3em;box-shadow:0 6px 8px -6px rgba(0,0,0,.25)}.two>div:first-child .items{display:none}}
.fig{position:relative;width:100%;max-width:calc((100vh - 9em) * 1.45);border:2px solid #111;border-radius:.3em;overflow:hidden;background:#fff;margin:0 auto}
.fig img{display:block;width:100%;height:auto}
.fig .cap{font-size:.6em;color:var(--grey);text-align:center}
.hs{position:absolute;border:4px solid transparent;border-radius:6px;background:transparent;padding:0;min-width:0;min-height:0}
.hs.tap{cursor:pointer}
.hs.tap:hover{background:rgba(26,86,184,.10)}
.hs{z-index:3}
.zin{position:relative;transform-origin:0 0}
@media (prefers-reduced-motion:no-preference){.zin{transition:transform .45s ease}}
.fig+.wholebar{position:relative}
.wholebar{display:flex;justify-content:flex-end;max-width:calc((100vh - 9em) * 1.45);margin:.25em auto 0}
.wholebar:empty,.wholebar .hidden{display:none}
.whole{background:#111;color:#fff;border:2px solid #fff;border-radius:2em;font-size:.6em;font-weight:700;padding:.15em .7em;min-height:2.2em;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.spot{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.spot .dim{fill:rgba(20,20,20,.42)}
.spot .ln{fill:none;vector-effect:non-scaling-stroke;stroke-width:2.5}
.spot .ln.on{stroke:var(--what)}
.spot .ln.ref{stroke:var(--where);stroke-width:1.5}
.spot .ln.zone{stroke:var(--where);stroke-width:1.5}
.spot .ln.maybe{stroke:#222;stroke-dasharray:5 4;stroke-width:2}
.spot .q circle{fill:#111} .spot .q text{fill:#fff;font:700 30px var(--head);text-anchor:middle;dominant-baseline:central}
@media (prefers-reduced-motion:no-preference){.spot .dim{animation:fade .35s ease-out}.spot .ln.on{animation:glow 1.6s ease-in-out infinite}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes glow{0%,100%{stroke-opacity:1}50%{stroke-opacity:.45}}
/* ---- chips, cards, buttons ---- */
.chips{display:flex;flex-wrap:wrap;gap:.35em}
.chip{border:3px solid #111;background:#fff;border-radius:.4em;padding:.15em .55em;min-height:2em;font-weight:700;text-align:left}
.chip.w1{border-color:var(--what);color:var(--what)}
.chip.w2{border-color:var(--where);color:#8a5210}
.chip.sel.w1{background:var(--what);color:#fff}
.chip.sel.w2{background:var(--where);color:#fff}
.chip.sel{background:#111;color:#fff}
.say{border:2px solid #111;border-bottom-width:6px;border-radius:.3em;padding:.35em .6em;margin:.5em 0;background:#fff}
.say.c1{background:var(--whatT);border-color:var(--what)}
.say.c1 .k{color:var(--what)}
.say.c2{background:var(--whereT);border-color:var(--where)}
.say.c2 .k{color:#8a5210}
.say .parts{display:flex;flex-wrap:wrap;gap:.3em;margin-top:.25em}
.say .pt{border:2px solid var(--what);background:#fff;color:var(--what);border-radius:.4em;padding:.1em .5em;min-height:1.9em;font-weight:700;font-size:.9em}
.say .pt.sel{background:var(--what);color:#fff}
.lens{position:relative;width:100%;margin-top:.35em;border:2px solid var(--what);border-radius:.3em;background-color:#fff;background-repeat:no-repeat;overflow:hidden}
.lens span{position:absolute;border:2.5px solid var(--what);border-radius:8px}
.lens span.r{border:1.5px solid var(--where)}
.lens{display:block}
.lenscap{display:block;font-size:.7em;color:var(--grey);margin-top:.2em}
.say .hint{display:block;font-size:.7em;color:var(--grey);margin-top:.2em}
.say .k{font-size:.65em;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.05em;display:block}
.note{display:flex;border-radius:.3em;overflow:hidden;background:var(--panel);margin:.5em 0}
.note .bd{background:#444;color:#fff;font-family:var(--head);font-weight:700;min-width:1.6em;display:flex;justify-content:center;padding-top:.2em}
.note.tip .bd{background:#111}
.note.warn .bd{background:#9b3b2e}
.note .tx{padding:.35em .6em}
.note p{margin:.1em 0}
.big{font-family:var(--head);font-weight:700;font-size:1.5em;line-height:1.2;margin:.2em 0}
.huge{font-family:var(--head);font-weight:700;font-size:2.1em;line-height:1.1;margin:.1em 0}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:.6em;margin:.4em 0}
@media (max-width:700px){.vs{grid-template-columns:1fr}}
.vs>div{border:2px solid #111;border-radius:.3em;padding:.35em .6em}
.vs .no{background:#f6f6f6}
.vs .no .k{color:var(--bad)} .vs .yes .k{color:var(--ok)}
.vs .k{font-weight:700;font-size:.7em;text-transform:uppercase;letter-spacing:.05em;display:block}
.no .q{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:3px}
.formula{display:flex;flex-wrap:wrap;gap:.3em;align-items:stretch;margin:.4em 0}
.formula>div{border:3px solid #111;border-radius:.35em;padding:.2em .6em;text-align:center;flex:1 1 7em}
.formula .plus{border:0;flex:0 0 auto;font-family:var(--head);font-weight:700;font-size:1.3em;display:flex;align-items:center;padding:0}
.formula .w1{border-color:var(--what);background:var(--whatT)}
.formula .w2{border-color:var(--where);background:var(--whereT)}
.formula small{display:block;font-size:.6em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--grey)}
.step{border-left:8px solid #111;background:var(--panel);padding:.3em .6em;margin:.4em 0;border-radius:0 .3em .3em 0}
.step.w1{border-color:var(--what)} .step.w2{border-color:var(--where)} .step.done{border-color:var(--ok);background:var(--okT)}
.step .k{font-size:.65em;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--grey);display:block}
.hidden{display:none!important}
.go{background:#111;color:#fff;border:3px solid #111;border-radius:.4em;padding:.2em .8em;min-height:2.1em;font-weight:700;margin:.3em 0}
.go.ghost{background:#fff;color:#111}
.opts{display:grid;gap:.35em;margin:.3em 0}
.opt{border:3px solid #111;background:#fff;border-radius:.4em;padding:.25em .6em;min-height:2.2em;text-align:left;font-weight:700}
.opt:hover{background:#f3f3f3}
.opt.right{background:#111;color:#fff}
.opt.right::before{content:"\2713  "}
.opt.wrong{color:#777;border-color:#999;text-decoration:line-through;background:repeating-linear-gradient(45deg,#f2f2f2 0 8px,#e4e4e4 8px 16px)}
.opt.wrong::before{content:"\2717  "}
.fb{border-radius:.3em;padding:.3em .6em;margin:.3em 0;font-size:.9em}
.fb.good{background:var(--okT);border-left:8px solid var(--ok)}
.fb.bad{background:var(--badT);border-left:8px solid var(--bad)}
.fb b{display:block}
.built{border:3px dashed #111;border-radius:.4em;padding:.3em .6em;margin:.4em 0;min-height:2em;background:#fff}
.items{display:grid;gap:.4em}
.item{border:2px solid #111;border-bottom-width:5px;border-radius:.3em;padding:.3em .6em;background:#fff;display:flex;gap:.5em;align-items:flex-start;text-align:left;width:100%}
.item .n{background:#111;color:#fff;font-family:var(--head);font-weight:700;min-width:1.4em;text-align:center;border-radius:.15em;flex:0 0 auto}
.item .lt{border:2px solid #111;border-radius:50%;min-width:1.4em;height:1.4em;display:inline-flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:.8em}
.item .ans{display:block;margin-top:.2em}
.item.open{border-color:var(--ok)}
.cover{display:flex;flex-direction:column;justify-content:center;min-height:calc(100vh - 7em)}
.eyebrow{font-family:var(--head);font-weight:700;color:var(--grey);font-size:.75em;letter-spacing:.05em}
.panelL{border-left:12px solid #111;background:var(--panel);padding:.5em 1em;border-radius:0 .3em .3em 0}
.legend{display:flex;flex-wrap:wrap;gap:.6em;font-size:.8em;margin:.2em 0 .4em}
/* ---- bottom bar ---- */
.bot{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:3px solid #111;display:flex;align-items:center;gap:.5em;padding:.25em .6em;min-height:2.6em}
.bot .tip{flex:1;color:var(--grey);font-size:.72em;min-width:0}
.nav{background:#111;color:#fff;border:3px solid #111;border-radius:.4em;min-height:2em;padding:0 .9em;font-weight:700}
.nav.back{background:#fff;color:#111}
.nav:disabled{opacity:.35;cursor:default}
@media (max-width:700px){.top .addr{display:none}#fs{display:none}.bot .tip{display:none}.bot{justify-content:space-between}}

/* DO words */
.acc{display:flex;flex-direction:column;gap:.45em}
.accard{border:3px solid var(--gc);border-radius:.45em;overflow:hidden;background:#fff;scroll-margin-top:.5em}
.acch{width:100%;display:flex;align-items:center;gap:.55em;background:#fff;border:0;padding:.35em .6em;text-align:left;min-height:2.6em}
.acch .dtn{background:var(--gc);color:#fff;border-radius:.2em;min-width:1.4em;text-align:center;font-family:var(--head);font-weight:700;font-size:1.05em}
.acct{flex:1;display:flex;flex-direction:column;min-width:0}
.accw{font-weight:700;font-size:1.05em}
.accw i{font-style:normal;font-weight:400;color:var(--grey);font-size:.8em}
.accm{font-size:.78em;color:var(--ink2)}
.accx{font-size:.7em;
}
@media (max-width:600px){.accx .ot{display:none}.accx{font-size:1em}.acch{gap:.4em;padding:.35em .45em}}
.accx{font-weight:700;color:var(--gc);white-space:nowrap}
.accard.open .acch{background:var(--gc);color:#fff}
.accard.open .acch .dtn{background:#fff;color:var(--gc)}
.accard.open .accm,.accard.open .accx,.accard.open .accw i{color:#fff}
.accb .dopanel{border:0!important;border-radius:0;padding:.5em .7em!important}

.g0{--gc:#0f7d7d;--gt:#e1f2f2}.g1{--gc:#6a3fa0;--gt:#efe8f7}.g2{--gc:#a8326e;--gt:#f8e6ef}
.dotab{border-color:var(--gc)!important}
.dotab .dtn{background:var(--gc)!important;color:#fff!important}
.dotab.sel{background:var(--gc)!important;color:#fff!important}
.dotab.sel .dtn{background:#fff!important;color:var(--gc)!important}
.dopanel{border-color:var(--gc)!important;padding-top:0!important;overflow:hidden}
.dohead{grid-column:1/-1;background:var(--gc);color:#fff;font-weight:700;margin:0 -.7em;padding:.25em .7em;display:flex;gap:.45em;align-items:center}
.dohead .dtn{background:#fff;color:var(--gc);border-radius:.2em;min-width:1.3em;text-align:center;font-family:var(--head)}
.dopanel .dov .pill.act{background:var(--gt);border-bottom-color:var(--gc)}
.dopanel .doart{background:var(--gt)}

.dotabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.35em;margin-bottom:.45em}
@media (max-width:700px){.dotabs{grid-template-columns:1fr}}
.dotab{border:3px solid #111;background:#fff;border-radius:.4em;padding:.2em .5em;min-height:2.2em;font-weight:700;text-align:left;display:flex;gap:.4em;align-items:center;font-size:.85em}
.dotab .dtn{background:#111;color:#fff;border-radius:.2em;min-width:1.3em;text-align:center;font-family:var(--head)}
.dotab.sel{background:#111;color:#fff}.dotab.sel .dtn{background:#fff;color:#111}
.dopanel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:.8em;border:2px solid #111;border-bottom-width:6px;border-radius:.35em;padding:.5em .7em;background:#fff}
@media (max-width:800px){.dopanel{grid-template-columns:1fr}}
.dolab{font-size:.65em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);margin:.1em 0}
.dolab.ok{color:var(--ok)}.dolab.bad{color:var(--bad)}
.dov.big2{font-size:1em;margin-bottom:.3em}
.dov .eq{font-size:.75em;font-weight:700;color:var(--grey);font-family:var(--body)}
.dopanel .doart{max-height:min(7.5em,30vh);height:auto}
.doleft{display:flex;align-items:flex-start}
.dopanel .dom{font-size:1.1em;margin:.05em 0 .35em}
.dobr{background:var(--panel);border-radius:.3em;padding:.25em .55em;margin:.3em 0;font-size:.85em}
.dobr ul{margin:.1em 0;padding-left:1.1em}
.dorw{display:grid;grid-template-columns:1fr 1fr;gap:.5em;margin:.3em 0}
.dorw.one{grid-template-columns:1fr}
@media (min-width:801px){.dorw.one ul{columns:2;column-gap:1em}.dorw.one li{break-inside:avoid}}
@media (max-width:500px){.dorw{grid-template-columns:1fr}}
.dorw>div{border-radius:.3em;padding:.25em .5em}
.rcol{background:var(--okT)} .wcol{background:var(--badT)}
.dorw ul{list-style:none;margin:0;padding:0;font-size:.9em}
.dorw li{display:flex;gap:.35em;align-items:flex-start;margin:.15em 0}
.tk{color:var(--ok);font-weight:700}.xk{color:var(--bad);font-weight:700}
.wcol li span:last-child{text-decoration:line-through;text-decoration-color:var(--bad)}

.pill .sm{font-weight:400;color:#555}
.dokey{font-size:.85em}
.dosay{list-style:none;margin:.2em 0;padding:0;font-size:.8em}
.dosay li{display:flex;gap:.35em;align-items:baseline;padding:.05em 0}
.dosay li b{min-width:1.1em;text-align:center}
.dosay .yes b{color:var(--ok)} .dosay .same b{color:var(--what)} .dosay .same i{font-style:normal;font-weight:700;color:var(--what)}
.dosay .no b{color:var(--bad)} .dosay .no span{text-decoration:line-through;text-decoration-color:var(--bad);color:#666}

.dogrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6em}
@media (max-width:900px){.dogrid{grid-template-columns:1fr}}
.docard{border:2px solid #111;border-bottom-width:6px;border-radius:.35em;padding:.4em .55em;background:#fff;display:flex;flex-direction:column}
.dov{display:flex;flex-wrap:wrap;align-items:center;gap:.2em;font-size:.9em}
.dov .eq{font-family:var(--head);font-weight:700;color:var(--grey);padding:0 .1em}
.doart{width:100%;max-height:5.2em;margin:.3em 0;background:var(--panel);border-radius:.3em}
.dom{margin:.1em 0;font-weight:700}
.don{margin:.1em 0;font-size:.8em;color:var(--grey)}
.doex{margin:.2em 0 0;font-size:.85em}
.doart g,.doart rect,.doart line{transform-box:fill-box}
.a-type .tclip{transform-origin:left center}
@media (prefers-reduced-motion:no-preference){
 .a-click .cur{animation:cpush 2.6s infinite}
 .a-click .btnL{animation:cbtn 2.6s infinite}
 .a-click .burst{animation:cburst 2.6s infinite}
 .a-open .b1{animation:ob1 3.2s infinite}.a-open .b2{animation:ob2 3.2s infinite}
 .a-open .win{transform-origin:left bottom;animation:owin 3.2s infinite}
 .a-move .cin{animation:mcur 3.4s infinite}
 .a-move .drop{animation:mdrop 3.4s infinite}
 .a-scroll .pg{animation:spg 3.4s ease-in-out infinite}
 .a-scroll .thumb{animation:sth 3.4s ease-in-out infinite}
 .a-type .tclip{animation:ttype 3.6s steps(17) infinite}
 .a-type .k{animation:tkey 3.6s infinite}
 .a-type .k1{animation-delay:.3s}.a-type .k2{animation-delay:.7s}.a-type .k3{animation-delay:1s}.a-type .k4{animation-delay:1.4s}.a-type .k5{animation-delay:1.7s}.a-type .k6{animation-delay:2.1s}.a-type .k7{animation-delay:2.4s}
 .a-look .pupil{animation:lpup 2.4s ease-in-out infinite}
 .a-look .rd{animation:lrd 4.8s steps(1) infinite}
 .a-search .mag{animation:smag 3.4s ease-in-out infinite}
 .a-search .hit{animation:shit 3.4s infinite}
 .a-close .tab,.a-close .x{animation:ctab 3s infinite}
 .a-back .pg2{animation:bpg 3.2s ease-in-out infinite}
}
@keyframes cpush{0%,40%,62%,100%{transform:none}48%,55%{transform:translateY(4px)}}
@keyframes cbtn{0%,40%,62%,100%{opacity:.25}46%,58%{opacity:1}}
@keyframes cburst{0%,44%,72%,100%{opacity:0}50%,64%{opacity:1}}
@keyframes ob1{0%,15%{opacity:0}20%,92%{opacity:1}100%{opacity:0}}
@keyframes ob2{0%,30%{opacity:0}35%,92%{opacity:1}100%{opacity:0}}
@keyframes owin{0%,40%{transform:scale(0);opacity:0}58%,92%{transform:scale(1);opacity:1}100%{transform:scale(0);opacity:0}}
@keyframes mcur{0%{transform:translate(-74px,80px)}45%,100%{transform:none}}
@keyframes mdrop{0%,50%{opacity:0}58%,95%{opacity:1}100%{opacity:0}}
@keyframes spg{0%,12%{transform:none}55%,80%{transform:translateY(-62px)}100%{transform:none}}
@keyframes sth{0%,12%{transform:none}55%,80%{transform:translateY(64px)}100%{transform:none}}
@keyframes ttype{0%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}
@keyframes tkey{0%,8%{fill:#1a56b8}12%,100%{fill:#fff}}
@keyframes lpup{0%,100%{transform:translateX(-7px)}50%{transform:translateX(9px)}}
@keyframes lrd{0%{transform:none}25%{transform:translateY(16px)}50%{transform:translateY(32px)}75%{transform:translateY(48px)}}
@keyframes smag{0%{transform:translate(-110px,-22px)}25%{transform:translate(-40px,-22px)}55%,85%{transform:none}100%{transform:translate(-110px,-22px)}}
@keyframes shit{0%,50%{stroke:#c9cdd3}58%,88%{stroke:#1a56b8}100%{stroke:#c9cdd3}}
@keyframes ctab{0%,40%{opacity:1;transform:none}60%,85%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:none}}
@keyframes bpg{0%,25%{transform:none;opacity:1}55%,85%{transform:translateX(70px);opacity:0}100%{transform:none;opacity:1}}

.menub{background:#fff!important;color:#111!important;border-color:#fff!important;white-space:nowrap}
.menub.here{opacity:.5}
@media (max-width:700px){.top .dots{display:none}}
.mhead{display:flex;flex-wrap:wrap;gap:.6em;align-items:flex-end;justify-content:space-between;border-left:12px solid #111;background:var(--panel);padding:.4em .9em;border-radius:0 .3em .3em 0;margin-bottom:.6em}
.mstart{font-size:1.05em}
.mgroup{margin:.5em 0 .8em}
.mgh{font-family:var(--head);font-weight:700;color:#fff;background:var(--mc);padding:.15em .6em;border-radius:.3em .3em 0 0;display:inline-block;font-size:.9em}
.mtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(11.5em,1fr));gap:.4em;border-top:4px solid var(--mc);padding-top:.45em}
@media (max-width:600px){.mtiles{grid-template-columns:1fr}}
.mtile{display:flex;gap:.5em;align-items:center;text-align:left;border:2px solid var(--mc);border-bottom-width:5px;border-radius:.4em;background:#fff;padding:.35em .55em;min-height:2.8em;position:relative}
.mtile:hover{background:#f6f6f8}
.mic{font-size:1.2em;flex:0 0 auto}
.mtx{display:flex;flex-direction:column;min-width:0}
.mtx b{font-size:.95em;line-height:1.2}
.mtx span{font-size:.7em;color:var(--grey)}
.mtile.seen{background:#f3f7f4}
.mtile{padding-right:1.7em}
@media (max-width:600px){.mhead .huge{font-size:1.45em}.mhead{padding:.3em .6em}}
.mtick{position:absolute;right:.4em;top:.3em;color:var(--ok);font-weight:700}

.mbtns{display:flex;flex-wrap:wrap;gap:.4em}
#again.arm{background:#9b3b2e;color:#fff;border-color:#9b3b2e}
.mprog{font-style:normal;align-self:flex-start;margin-top:.15em;font-size:.62em;font-weight:700;color:var(--mc);background:#fff;border:1.5px solid var(--mc);border-radius:1em;padding:0 .45em}
.vcard.tapped{border-color:var(--ok)}
.chip.tapped:not(.sel){box-shadow:inset 0 -4px 0 rgba(30,122,70,.35)}
/* KEY WORDS */
.nav.wait{background:#fff;color:#111;border-style:dashed}
.flash{animation:fl 1s ease 2}
@keyframes fl{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 6px rgba(26,86,184,.45)}}

.vsvg{display:block;width:100%;height:auto;aspect-ratio:16/10;background:#f6f7f9;border-radius:.25em}
.vsvg text{font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif}
.qpic .vsvg{border:2px solid #111;max-height:42vh}
.gap{display:inline-block;min-width:4em;border-bottom:4px solid var(--what);color:var(--what)}

.usent{line-height:1.5}
.usefb{display:flex;gap:.6em;align-items:center}
.uicon{flex:0 0 5em}

.vpic{position:relative;display:block;width:100%;aspect-ratio:16/10;overflow:hidden;background:#fff;border-radius:.25em;border:1px solid var(--line)}
.vpic{background-repeat:no-repeat;background-color:#fff}
.vhl{position:absolute;border:2.5px solid var(--what);border-radius:6px;box-shadow:0 0 0 2px rgba(255,255,255,.8)}
.vtools{display:flex;flex-wrap:wrap;gap:.5em;align-items:center;margin:.1em 0 .4em}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.6em,1fr));gap:.45em}

.vcard{display:flex;flex-direction:column;gap:.2em;border:2px solid #111;border-bottom-width:5px;border-radius:.35em;background:#fff;padding:.3em;text-align:left}
.vcard .vw{font-weight:700;color:var(--what);font-size:.95em;line-height:1.15}
.vcard .vm{font-size:.62em;color:var(--ink2);line-height:1.25}

.qcount{font-family:var(--head);font-weight:700;font-size:.8em;color:var(--grey);margin:.1em 0 .3em}
.qcount span{font-weight:400}

.endc{text-align:center;border:2px solid #111;border-bottom-width:6px;border-radius:.4em;padding:.6em}

/* One verb group at a time: tabs on top, one big panel underneath */
function bracketLines(v){
  var out=[];
  v.forEach(function(x){var m=x.match(/^(.*?)\s*\((.+?)\)(.*)$/);
    if(m){var a=(m[1]+m[3]).replace(/\s+/g,' ').trim(), b=(m[1]+' '+m[2]+m[3]).replace(/\s+/g,' ').trim();
      out.push('<li><span class="pill act">'+a+'</span> and <span class="pill act">'+b+'</span> are both right.</li>');}});
  return out.length?'<div class="dobr"><b>Small word in ( )?</b><ul>'+out.join('')+'</ul></div>':'';
}
function doPanel(d,i){
  var right=[], wrong=[];
  d.say.forEach(function(r){
    if(r[0]==="=") {right.push('<li><span class="tk">✓</span><span>'+r[1]+'</span></li>');right.push('<li><span class="tk">✓</span><span>'+r[2]+'</span></li>');}
    else if(r[0]==="y") right.push('<li><span class="tk">✓</span><span>'+r[1]+'</span></li>');
    else wrong.push('<li><span class="xk">✗</span><span>'+r[1]+'</span></li>');
  });
  return '<div class="dopanel">'+
   '<div class="doleft">'+ART[d.art]+'</div>'+
   '<div class="doright">'+
    bracketLines(d.v)+
    '<div class="dorw'+(wrong.length?'':' one')+'"><div class="rcol"><div class="dolab ok">Right</div><ul>'+right.join('')+'</ul></div>'+
    (wrong.length?'<div class="wcol"><div class="dolab bad">Wrong</div><ul>'+wrong.join('')+'</ul></div>':'')+'</div>'+
    (d.n?'<div class="note tip"><div class="bd">✓</div><div class="tx"><p>'+d.n+'</p></div></div>':'')+
   '</div></div>';
}

function colour(s){
 var whats=["the address bar","the logo","the search box","the back arrow","the x on the tab","the tab"];
 var wheres=["at the top, under the tabs","on the left, next to the website name","on the right, above the menu bar","at the top, on the left","at the top"];
 var acts=["Type it in","Click on","Look at","Press","Close"];
 for(var i=0;i<wheres.length;i++){if(s.indexOf(wheres[i])>-1){s=s.replace(wheres[i],'\u0001'+i+'\u0002');}}
 for(var j=0;j<whats.length;j++){if(s.indexOf(whats[j])>-1 && s.indexOf('\u0003')<0){s=s.replace(whats[j],'\u0003'+j+'\u0004');}}
 for(var k=0;k<acts.length;k++){if(s.indexOf('“'+acts[k])===0){s=s.replace(acts[k],'\u0005'+k+'\u0006');break;}}
 s=s.replace(/\u0001(\d+)\u0002([.”]*)/g,function(m,a,b){return tail(w2(wheres[+a])+b);});
 s=s.replace(/\u0003(\d+)\u0004/g,function(m,a){return w1(whats[+a]);});
 s=s.replace(/\u0005(\d+)\u0006/g,function(m,a){return act(acts[+a]);});
 return s;
}

}
function go(n){if(n<0||n>=S.length) return; cur=n; if(S[n].doneOnView) mark(S[n].doneOnView,'seen',1); render();}
$('#prev').addEventListener('click',function(){go(cur-1);});
$('#menuBtn').addEventListener('click',function(){go(0);});
function goNext(){var s=S[cur]; if(s.onNext&&s.onNext()) return; go(cur+1);}
$('#next').addEventListener('click',goNext);
$('#aplus').addEventListener('click',function(){setSize(size+1);});
$('#aminus').addEventListener('click',function(){setSize(size-1);});
$('#fs').addEventListener('click',function(){
  try{ if(!document.fullscreenElement){document.documentElement.requestFullscreen();} else {document.exitFullscreen();} }catch(e){}
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='PageDown') goNext();
  if(e.key==='ArrowLeft'||e.key==='PageUp') go(cur-1);
  if(e.key==='Home'||e.key==='Escape') go(0);
});
render();
</script>
</body>
</html>
